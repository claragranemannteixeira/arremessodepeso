<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galinha dos Ovos de Ouro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
overflow:hidden;
text-align:center;

background:linear-gradient(
to bottom,
#7a0000,
#b30000,
#d4af37
);
}

h1{
margin-top:25px;
font-size:50px;
color:#ffd700;

text-shadow:
0 0 10px gold,
0 0 20px gold,
0 0 40px gold;
}

#jogo{
margin-top:20px;
}

.cartas{
display:flex;
justify-content:center;
gap:20px;
margin-top:40px;
}

.carta{

width:140px;
height:140px;

background:#fff8dc;

border:3px solid gold;

border-radius:25px;

display:flex;
justify-content:center;
align-items:center;

font-size:80px;

box-shadow:
0 0 20px rgba(0,0,0,.3);

transition:.4s;
}

.dourado{
box-shadow:
0 0 20px gold,
0 0 40px gold,
0 0 60px gold;

animation:piscar 1s infinite;
}

@keyframes piscar{

50%{
transform:scale(1.08);
}

}

button{

padding:18px 40px;

font-size:25px;

margin-top:30px;

border:none;

border-radius:20px;

cursor:pointer;

font-weight:bold;

background:linear-gradient(
45deg,
#ffd700,
#ffb700
);

color:#7a0000;

box-shadow:
0 0 15px gold;
}

button:hover{
transform:scale(1.05);
}

#resultado{

margin-top:25px;

font-size:30px;

font-weight:bold;

color:#ffd700;

text-shadow:
0 0 10px gold,
0 0 20px gold;
}

#placar{

margin-top:15px;

font-size:24px;

font-weight:bold;

color:white;
}

#vitoria{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:
linear-gradient(
135deg,
#7a0000,
#b30000,
#ffd700
);

justify-content:center;
align-items:center;
flex-direction:column;

z-index:999;

animation:entrada .8s;
}

@keyframes entrada{

from{
transform:scale(0);
}

to{
transform:scale(1);
}

}

#vitoria h2{

font-size:60px;

color:white;

text-shadow:
0 0 20px gold,
0 0 40px gold;
}

#vitoria p{

font-size:28px;

color:white;

margin:20px;
}

.particula{

position:absolute;

font-size:28px;

pointer-events:none;

animation:subir 3s linear forwards;
}

@keyframes subir{

from{
transform:translateY(0);
opacity:1;
}

to{
transform:translateY(-500px);
opacity:0;
}

}

</style>
</head>
<body>

<h1>🐔 Galinha dos Ovos de Ouro</h1>

<div id="jogo">

<div class="cartas">

<div class="carta" id="c1">🥚</div>
<div class="carta" id="c2">🥚</div>
<div class="carta" id="c3">🥚</div>

</div>

<button onclick="sortear()">
🎲 SORTear
</button>

<div id="resultado">
Boa sorte!
</div>

<div id="placar">

⭐ Pontos:
<span id="pontos">0</span>

<br><br>

🎯 Tentativas:
<span id="tentativas">0</span>

</div>

</div>

<div id="vitoria">

<h2>🏆 JACKPOT!</h2>

<p>
🐔✨ A Galinha dos Ovos de Ouro escolheu você! ✨🥚
</p>

<button onclick="location.reload()">
Jogar Novamente
</button>

</div>

<script>

let pontos = 0;
let tentativas = 0;

function gerarPremio(){

let r = Math.random()*100;

if(r < 40) return "🐥";
if(r < 70) return "🐔";
if(r < 92) return "🥚";

return "🥇";
}

function criarParticulas(){

for(let i=0;i<60;i++){

let p = document.createElement("div");

p.className = "particula";

p.innerHTML = "✨";

p.style.left =
Math.random()*window.innerWidth + "px";

p.style.top =
window.innerHeight + "px";

document.body.appendChild(p);

setTimeout(()=>{
p.remove();
},3000);

}

}

function sortear(){

tentativas++;

let a = gerarPremio();
let b = gerarPremio();
let c = gerarPremio();

let cartas = [
document.getElementById("c1"),
document.getElementById("c2"),
document.getElementById("c3")
];

cartas[0].innerHTML = a;
cartas[1].innerHTML = b;
cartas[2].innerHTML = c;

cartas.forEach(carta=>{
carta.classList.remove("dourado");
});

if(a==="🥇") cartas[0].classList.add("dourado");
if(b==="🥇") cartas[1].classList.add("dourado");
if(c==="🥇") cartas[2].classList.add("dourado");

let dourados =
[a,b,c].filter(x=>x==="🥇").length;

if(dourados===3){

pontos += 100;

document.getElementById("resultado")
.innerHTML =
"🏆 JACKPOT!!!";

criarParticulas();

setTimeout(()=>{

document.getElementById("vitoria")
.style.display="flex";

},1000);

}
else if(dourados===2){

pontos += 40;

document.getElementById("resultado")
.innerHTML =
"✨ Dois ovos dourados!";

}
else if(a===b && b===c){

pontos += 25;

document.getElementById("resultado")
.innerHTML =
"🎉 Três iguais!";

}
else{

pontos += 5;

document.getElementById("resultado")
.innerHTML =
"😊 Continue tentando!";

}

document.getElementById("pontos")
.innerHTML = pontos;

document.getElementById("tentativas")
.innerHTML = tentativas;

}

</script>

</body>
</html>
